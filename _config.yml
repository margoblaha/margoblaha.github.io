# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
# ------------------------------------------------------------
# Site settings
# ------------------------------------------------------------
title: "Margo Blaha"
title_separator: "|"
email: "marharyta.blaha@gmail.com"                                         # optional: public contact email, or leave empty
description: >-
  Essays, research notes and reflections on science, gender, creativity and culture, by a researcher who studies mosquitoes and thinks about everything else.
url: "https://margoblaha.github.io"
baseurl: ""                                       
locale: "en-GB"
timezone: Europe/Rome
words_per_minute: 200
breadcrumbs: false

# Social identity
github_username: margoblaha
# twitter:
#   username: "yourhandle"                        # uncomment only if you use X/Twitter (enables Twitter cards)
og_image: /assets/images/og-default.jpg           # CHANGE: 1200x630 px default social-share image (upload to assets/images/)

# Look and feel
minimal_mistakes_skin: "dark"                      # try "dirt" for warmer tones
search: true

# ------------------------------------------------------------
# Build settings
# ------------------------------------------------------------
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/

include:
  - _pages

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

