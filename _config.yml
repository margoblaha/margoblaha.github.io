# ------------------------------------------------------------
# Defaults for posts and pages
# ------------------------------------------------------------
defaults:
  # Posts (everything in _posts/)
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false     # keeps reading pages clean; set true for a sidebar bio
      read_time: true
      show_date: true
      comments: false
      share: true
      related: false
  # Pages (everything in _pages/)
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
